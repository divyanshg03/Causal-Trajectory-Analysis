[project]
name = "cftraj"
version = "0.2.0"
description = "Counterfactual scene reasoning for trajectory prediction on KITTI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["torch>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
video = ["opencv-python>=4.8"]

[project.scripts]
cftraj = "cftraj.__main__:main"

[tool.setuptools]
packages = ["cftraj"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["venv", ".venv"]
