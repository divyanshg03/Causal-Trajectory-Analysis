[project]
name = "cftraj"
version = "0.3.0"
description = "Counterfactual scene reasoning for trajectory prediction on KITTI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["torch>=2.0", "numpy>=1.24", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8", "pyyaml>=6"]
yaml = ["pyyaml>=6"]
video = ["opencv-python>=4.8"]
app = ["streamlit>=1.30"]

[project.scripts]
cftraj = "cftraj.__main__:main"

[tool.setuptools]
packages = ["cftraj"]

[tool.setuptools.package-data]
cftraj = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
extend-exclude = ["venv", ".venv"]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = true
files = ["cftraj"]

[tool.coverage.run]
source = ["cftraj"]
omit = ["cftraj/viz.py"]  # needs OpenCV and real frames; covered by the demo smoke test

[tool.coverage.report]
fail_under = 80
show_missing = true
